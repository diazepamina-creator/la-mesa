<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eee3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<title>La mesa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  La mesa · ruta de estudio personal
  © Andrés Asensio · uso personal
  Un único HTML. Los datos viven en el almacenamiento del navegador del móvil:
  haz copia de seguridad desde Ajustes de vez en cuando.
-->
<style>
:root{
  --papel:#f3eee3; --papel2:#ebe4d5; --tarjeta:#fbf8f1; --tinta:#1f1b16; --tinta2:#5b5348; --tinta3:#8d8476;
  --linea:#d9d0bf; --laton:#b0893a; --ok:#3b6a4c; --aviso:#9a4a24;
  --sombra:0 1px 0 rgba(31,27,22,.06),0 6px 18px -10px rgba(31,27,22,.25);
  --serif:"Fraunces",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papel:#16140f; --papel2:#1e1b15; --tarjeta:#221f18; --tinta:#efe8da; --tinta2:#b9b0a0; --tinta3:#857d6f;
  --linea:#363127; --laton:#d0a957; --ok:#7fb08d; --aviso:#e08a5e;
  --sombra:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --papel:#16140f; --papel2:#1e1b15; --tarjeta:#221f18; --tinta:#efe8da; --tinta2:#b9b0a0; --tinta3:#857d6f;
  --linea:#363127; --laton:#d0a957; --ok:#7fb08d; --aviso:#e08a5e;
  --sombra:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.marca{font-family:var(--serif);font-size:1.35rem;font-weight:600;letter-spacing:.2px}
.marca small{font-family:var(--sans);font-weight:400;font-size:.75rem;color:var(--tinta3);margin-left:8px;letter-spacing:.06em;text-transform:uppercase}
.icobtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--linea);background:var(--tarjeta);display:grid;place-items:center}
.icobtn svg{width:20px;height:20px;stroke:var(--tinta2);fill:none;stroke-width:1.6}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tarjeta);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:64px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;color:var(--tinta3);letter-spacing:.03em}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.tabs button.on{color:var(--tinta)}
nav.tabs button.on svg{stroke:var(--laton)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
h2.sec{font-size:1.05rem;margin:28px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2.sec span{font-family:var(--sans);font-weight:400;font-size:.78rem;color:var(--tinta3)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta3)}
.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra)}
.muted{color:var(--tinta2)} .dim{color:var(--tinta3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--tinta);background:var(--tinta);color:var(--papel);border-radius:999px;padding:10px 18px;font-weight:500;font-size:.95rem;display:inline-flex;align-items:center;gap:8px}
.btn.sec{background:transparent;color:var(--tinta);border-color:var(--linea)}
.btn.peq{padding:7px 13px;font-size:.85rem}
.btn.peligro{background:transparent;color:var(--aviso);border-color:color-mix(in srgb,var(--aviso) 45%,transparent)}
.btn:disabled{opacity:.4}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;padding:3px 9px;border-radius:999px;border:1px solid var(--linea);color:var(--tinta2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pista{font-size:.8rem;color:var(--tinta3)}
/* hoy */
.saludo{padding:22px 0 4px}
.saludo h1{font-size:1.65rem;line-height:1.15}
.saludo p{margin:6px 0 0;color:var(--tinta2)}
.semana{padding:16px;margin-top:16px}
.semana .cifras{display:flex;align-items:baseline;justify-content:space-between}
.semana .grande{font-family:var(--serif);font-size:2rem;font-weight:600;line-height:1}
.barra{height:10px;border-radius:999px;background:var(--papel2);margin:12px 0 10px;position:relative;overflow:hidden}
.barra b{position:absolute;inset:0 auto 0 0;background:var(--laton);border-radius:999px;transition:width .5s}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.dias div{text-align:center;font-size:.7rem;color:var(--tinta3)}
.dias div span{display:block;height:6px;border-radius:3px;background:var(--papel2);margin-top:4px}
.dias div.si span{background:var(--tinta2)} .dias div.hoy{color:var(--tinta);font-weight:600}
.libro{padding:16px;position:relative;overflow:hidden}
.libro::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.libro .tit{font-family:var(--serif);font-size:1.12rem;line-height:1.2}
.libro .aut{font-size:.85rem;color:var(--tinta2);margin-top:2px}
.siguiente{margin:12px 0;padding:10px 12px;border-radius:10px;background:var(--papel2)}
.siguiente .eyebrow{margin-bottom:2px}
.siguiente .u{font-weight:500}
.marcapaginas{font-family:var(--serif);font-style:italic;color:var(--tinta2);font-size:.95rem;margin:8px 0 0;border-left:2px solid var(--laton);padding-left:10px}
.prog{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--tinta3);margin-top:10px}
.prog .barra{flex:1;height:5px;margin:0}
.prog .barra b{background:var(--c)}
.respaldo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--linea);font-size:.85rem}
.respaldo b{font-weight:500}
.ratos{display:grid;gap:10px}
.rato{padding:12px 14px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.rato::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.rato .txt{flex:1;min-width:0}
.rato .tit{font-family:var(--serif);font-size:1rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rato .sub{font-size:.78rem;color:var(--tinta3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapa{padding:14px 14px 10px;overflow-x:auto}
.mapa .rej{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;width:max-content}
.mapa .rej i{width:12px;height:12px;border-radius:3px;background:var(--papel2)}
.mapa .rej i.n1{background:color-mix(in srgb,var(--laton) 30%,var(--papel2))}
.mapa .rej i.n2{background:color-mix(in srgb,var(--laton) 55%,var(--papel2))}
.mapa .rej i.n3{background:color-mix(in srgb,var(--laton) 80%,var(--papel2))}
.mapa .rej i.n4{background:var(--laton)}
.mapa .rej i.fut{background:transparent}
.mapa .ley{display:flex;justify-content:space-between;font-size:.72rem;color:var(--tinta3);margin-top:8px}
.cita{padding:16px 18px}
.cita q{font-family:var(--serif);font-style:italic;font-size:1.08rem;line-height:1.4;display:block;quotes:"«" "»"}
.cita .pie{font-size:.78rem;color:var(--tinta3);margin-top:8px}
/* sesión activa */
.activa{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;max-width:616px;margin:0 auto;background:var(--tinta);color:var(--papel);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.activa .reloj{font-family:var(--mono);font-size:1.5rem;font-weight:500}
.activa .txt{flex:1;min-width:0;font-size:.82rem;line-height:1.25}
.activa .txt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activa .btn{background:var(--papel);color:var(--tinta);border-color:var(--papel)}
.punto{width:8px;height:8px;border-radius:50%;background:#e0644a;animation:lat 1.6s infinite}
@keyframes lat{50%{opacity:.25}}
body.con-activa{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
/* ruta */
.lineas{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.lineas button{flex:none;border:1px solid var(--linea);background:var(--tarjeta);border-radius:999px;padding:7px 14px;font-size:.85rem;display:flex;align-items:center;gap:7px}
.lineas button i{width:9px;height:9px;border-radius:50%}
.lineas button.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.cabl{margin:18px 0 6px}
.cabl h1{font-size:1.45rem}
.etapas{position:relative;margin-top:14px}
.etapa{position:relative;padding:0 0 22px 30px}
.etapa::before{content:"";position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--linea)}
.etapa:last-child::before{display:none}
.etapa .nodo{position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;border:2px solid var(--linea);background:var(--papel)}
.etapa.hecha .nodo{background:var(--c);border-color:var(--c)}
.etapa.aqui .nodo{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent);background:var(--tarjeta)}
.etapa.aqui .nodo::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--c)}
.etapa h3{font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aquitag{font-family:var(--sans);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;background:var(--c);color:#fff;padding:2px 8px;border-radius:999px;font-weight:500}
.lista{margin-top:10px;display:grid;gap:8px}
.it{padding:11px 13px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--linea);background:var(--tarjeta);border-radius:12px}
.it .txt{flex:1;min-width:0}
.it .tit{font-family:var(--serif);font-size:.98rem;line-height:1.2}
.it .sub{font-size:.76rem;color:var(--tinta3);margin-top:2px}
.it .mini{width:38px;height:38px;flex:none}
.it.atenuado{opacity:.62}
/* biblioteca */
.resumenb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.resumenb div{padding:12px;text-align:center}
.resumenb b{display:block;font-family:var(--serif);font-size:1.5rem;line-height:1.1}
.resumenb span{font-size:.72rem;color:var(--tinta3)}
.estante{margin-top:22px}
.estante h3{font-size:.95rem;display:flex;align-items:center;gap:8px}
.estante h3 i{width:10px;height:10px;border-radius:50%}
.balda{display:flex;margin-bottom:6px;align-items:flex-end;gap:3px;padding:12px 10px 0;margin-top:8px;border-bottom:7px solid color-mix(in srgb,var(--tinta2) 55%,var(--papel2));border-radius:4px 4px 2px 2px;background:linear-gradient(to bottom,transparent 0,color-mix(in srgb,var(--papel2) 70%,transparent) 100%);overflow-x:auto;scrollbar-width:none}
.lomo{flex:none;position:relative;border:0;padding:0;border-radius:3px 3px 1px 1px;background:var(--c);color:#fff;overflow:hidden;box-shadow:inset -3px 0 0 rgba(0,0,0,.18),inset 2px 0 0 rgba(255,255,255,.12)}
.lomo .t{position:absolute;inset:8px 0 18px;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--serif);font-size:.74rem;line-height:1.05;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:0 3px;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.lomo .lleno{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.22);border-top:1px solid rgba(255,255,255,.45)}
.lomo .banda{position:absolute;left:0;right:0;bottom:6px;height:4px;background:rgba(255,255,255,.35)}
.lomo.pedido{background:repeating-linear-gradient(135deg,var(--c) 0 6px,color-mix(in srgb,var(--c) 70%,#000) 6px 12px);opacity:.85}
.lomo.falta{background:transparent;border:1.5px dashed var(--c);color:var(--c);box-shadow:none}
.lomo.falta .t{text-shadow:none}
.lomo.terminado .banda{background:var(--laton);height:6px}
.lomo .pin{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid var(--laton)}
.leyenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:.74rem;color:var(--tinta3)}
.leyenda span{display:flex;align-items:center;gap:6px}
.leyenda i{width:12px;height:16px;border-radius:2px;display:inline-block}
/* cuaderno */
.totales{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.totales div{padding:12px}
.totales b{display:block;font-family:var(--serif);font-size:1.45rem;line-height:1.1}
.totales span{font-size:.72rem;color:var(--tinta3)}
.sellos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.sello{padding:10px 6px;text-align:center;border-radius:12px;border:1px dashed var(--linea);color:var(--tinta3);font-size:.72rem;line-height:1.2}
.sello svg{width:34px;height:34px;display:block;margin:0 auto 6px;stroke:currentColor;fill:none;stroke-width:1.4}
.sello.si{border-style:solid;border-color:color-mix(in srgb,var(--laton) 60%,transparent);color:var(--tinta);background:color-mix(in srgb,var(--laton) 9%,var(--tarjeta))}
.sello.si svg{stroke:var(--laton)}
.dia{margin-top:18px}
.dia .f{font-size:.78rem;color:var(--tinta3);margin-bottom:6px}.dia .f::first-letter{text-transform:uppercase}
.entrada{padding:12px 14px;margin-bottom:8px;position:relative;overflow:hidden}
.entrada::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.entrada .cab{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;color:var(--tinta2)}
.entrada .cab b{font-weight:500;color:var(--tinta)}
.entrada q{display:block;font-family:var(--serif);font-style:italic;margin-top:6px;quotes:"«" "»";font-size:1rem}
.entrada .det{font-size:.75rem;color:var(--tinta3);margin-top:6px}
select.filtro{width:100%;margin-top:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--linea);background:var(--tarjeta)}
/* hoja */
.velo{position:fixed;inset:0;z-index:50;background:rgba(20,17,12,.45);display:flex;align-items:flex-end;justify-content:center;animation:ap .18s ease}
@keyframes ap{from{opacity:0}}
.hoja{background:var(--papel);width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:sube .22s ease}
@keyframes sube{from{transform:translateY(30px)}}
.asa{width:40px;height:4px;border-radius:2px;background:var(--linea);margin:6px auto 12px}
.hoja h2{font-size:1.3rem;line-height:1.2}
.campo{margin-top:14px}
.campo label{display:block;font-size:.8rem;color:var(--tinta2);margin-bottom:5px}
.campo input,.campo select,.campo textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--linea);background:var(--tarjeta);font-size:1rem}
.campo textarea{min-height:84px;resize:vertical;font-family:var(--serif)}
.campo textarea.mono{font-family:var(--mono);font-size:.8rem;min-height:200px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px;border-radius:10px;background:var(--tarjeta);border:1px solid var(--linea)}
.check input{width:20px;height:20px;accent-color:var(--ok)}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;justify-content:flex-end}
.aviso{margin-top:14px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--aviso) 10%,var(--tarjeta));border:1px solid color-mix(in srgb,var(--aviso) 35%,transparent);font-size:.88rem}
.aviso b{color:var(--aviso)}
.opciones{display:grid;gap:8px;margin-top:12px}
.opcion{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--linea);background:var(--tarjeta);text-align:left;width:100%}
.opcion input{margin-top:3px;accent-color:var(--tinta)}
.opcion .tit{font-family:var(--serif)}
.opcion .sub{font-size:.78rem;color:var(--tinta3)}
.unidades{margin-top:10px;display:grid;gap:2px}
.unidad{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:8px;border:0;background:none;text-align:left;width:100%;font-size:.9rem}
.unidad .cuad{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--tinta3);flex:none;display:grid;place-items:center}
.unidad.hecha .cuad{background:var(--ok);border-color:var(--ok)}
.unidad.hecha .cuad::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.unidad.hecha span.t{color:var(--tinta3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--tinta3) 50%,transparent)}
.unidad.sig{background:color-mix(in srgb,var(--laton) 12%,transparent)}
.unidad .p{margin-left:auto;font-family:var(--mono);font-size:.75rem;color:var(--tinta3)}
.estad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.estad div{padding:10px;text-align:center}
.estad b{display:block;font-family:var(--serif);font-size:1.25rem}
.estad span{font-size:.7rem;color:var(--tinta3)}
.toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;background:var(--tinta);color:var(--papel);padding:10px 16px;border-radius:12px;font-size:.88rem;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:ap .2s;max-width:calc(100% - 32px);text-align:center}
.vacio{padding:24px;text-align:center;color:var(--tinta3);font-size:.9rem}
.sep{height:1px;background:var(--linea);margin:20px 0}
details.mas{margin-top:14px}
details.mas summary{font-size:.85rem;color:var(--tinta2);cursor:pointer;padding:6px 0}
.principio{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px dashed var(--linea);font-family:var(--serif);font-style:italic;color:var(--tinta2);font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.principio button{margin-left:auto;border:0;background:none;color:var(--tinta3);font-family:var(--sans);font-style:normal;font-size:.75rem;padding:2px 0;white-space:nowrap}
.normas{margin:10px 0 0;padding-left:18px;font-size:.9rem;color:var(--tinta2)}
.normas li{margin:6px 0}
</style>
</head>
<body>

function diaClave(t){ const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function lunes(t){ const d=new Date(t); d.setHours(0,0,0,0); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return d; }
function fmtMin(m){ m=Math.round(m); if(m<60) return m+' min'; const h=Math.floor(m/60), r=m%60; return h+' h'+(r?' '+r:''); }
function horas(m){ return (m/60).toFixed(m<600?1:0).replace('.',','); }
function haceDias(t){ const d=Math.floor((lunesDia(Date.now())-lunesDia(t))/864e5); return d<=0?'hoy':d===1?'ayer':'hace '+d+' días'; }
function lunesDia(t){ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function hash(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }

function indice(){

let IX = indice();
function prog(id){ return S.progreso[id] || (S.progreso[id]={hechas:[],marca:'',pagina:''}); }
function enMesa(id){ return S.mesa.foco.includes(id)?'foco':S.mesa.ratos.includes(id)?'ratos':null; }
function siguiente(id){ const b=IX[id]?.b; if(!b) return -1; const h=prog(id).hechas; return b.unidades.findIndex((u,i)=>!h.includes(i)); }
function respaldosDe(id){ return Object.values(IX).filter(x=>x.b.respaldoDe===id).map(x=>x.b); }
function sesDe(id){ return S.sesiones.filter(s=>s.libro===id); }
function minDe(id){ return sesDe(id).reduce((a,s)=>a+s.min,0); }
function pct(id){ const b=IX[id]?.b; if(!b||!b.unidades.length) return prog(id).terminado?1:0; return prog(id).hechas.length/b.unidades.length; }
function estadoLibro(id){
  const p=prog(id); if(p.terminado) return 'terminado';
  const m=enMesa(id); if(m) return m;

}
const ETQ = {foco:'En la mesa · foco', ratos:'Ratos muertos', terminado:'Terminado', aparcado:'Aparcado', 'en casa':'En casa', pdf:'PDF', pedido:'Pedido', 'por conseguir':'Por conseguir'};

function minSemana(t=Date.now()){
  const ini=lunes(t).getTime(), fin=ini+7*864e5;
  return S.sesiones.filter(s=>s.ini>=ini&&s.ini<fin).reduce((a,s)=>a+s.min,0);
}
function rachaSemanas(){
  const meta=S.ajustes.meta; let n=0; let t=lunes(Date.now()).getTime();
  if(minSemana(t)>=meta) n++;
  t-=7*864e5;
  while(minSemana(t)>=meta){ n++; t-=7*864e5; }
  return n;
}
function porDia(){ const m={}; S.sesiones.forEach(s=>{ const k=diaClave(s.ini); m[k]=(m[k]||0)+s.min; }); return m; }

function saludo(){
  const h=new Date().getHours();
  return h<6?'Buenas noches':h<14?'Buenos días':h<21?'Buenas tardes':'Buenas noches';
}
function vHoy(){
  const meta=S.ajustes.meta, sem=minSemana(), p=Math.min(1,sem/meta);
  const ini=lunes(Date.now()), pd=porDia(), hoyK=diaClave(Date.now());
  const racha=rachaSemanas();
  let frase;
  const ult=S.sesiones.at(-1), dias_sin= ult? Math.floor((lunesDia(Date.now())-lunesDia(ult.ini))/864e5) : null;
  if(sem>=meta) frase='Semana cumplida. Lo que venga ahora es regalo.';
  else if(dias_sin!==null && dias_sin>=7) frase='Bienvenido de vuelta. No hay nada que recuperar: retomas donde lo dejaste.';
  else if(sem===0) frase='Semana en blanco, y no pasa nada. Una sesión corta ya cuenta.';
  else {
    const r=sem/meta, sigH=Math.ceil((sem+1)/60)*60, faltaH=sigH-sem;
    if(faltaH<=20 && sigH<meta) frase= sigH===60 ? 'A '+faltaH+' min de tu primera hora de la semana.' : 'A '+faltaH+' min de las '+(sigH/60)+' h esta semana.';
    else if(r>=0.75) frase='Casi está: '+fmtMin(meta-sem)+' más y semana cumplida.';
    else if(r>=0.5) frase='Más de media semana hecha. Buen ritmo.';
    else frase='Llevas '+fmtMin(sem)+'. La meta orienta; no es un examen.';
  }
  const ps=proximoSello();
  const dias = DIAS.map((d,i)=>{ const k=diaClave(ini.getTime()+i*864e5+3600e3); return `<div class="${pd[k]?'si':''} ${k===hoyK?'hoy':''}">${d}<span></span></div>`; }).join('');

  const foco = S.mesa.foco.filter(id=>IX[id]);
  const ratos = S.mesa.ratos.filter(id=>IX[id]);
  const ultima = [...S.sesiones].reverse().find(s=>s.lleva);

  return `
  <div class="saludo"><p class="eyebrow">${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</p>
    <h1>${saludo()}, Andrés.</h1></div>

    <div class="cifras"><div><div class="eyebrow">Esta semana</div><div class="grande num">${fmtMin(sem)}</div></div>

    <div class="barra"><b style="width:${p*100}%"></b></div>
    <div class="muted" style="font-size:.88rem">${frase}${racha>1?` <span class="dim">· ${racha} semanas seguidas cumplidas</span>`:''}</div>
    ${ps?`<div class="pista" style="margin-top:8px">Próximo sello: <b style="font-weight:500;color:var(--tinta2)">${ps.n}</b> · ${ps.falta}</div>`:''}
    <div class="dias">${dias}</div>
  </section>

  ${S.ajustes.principios!==false?`<div class="principio"><span>${PRINCIPIOS[Math.floor(lunesDia(Date.now())/864e5)%PRINCIPIOS.length]}</span><button data-act="ajustes">normas</button></div>`:''}
  <h2 class="sec">El foco <span>${foco.length? 'lo que toca ahora':''}</span></h2>
  ${foco.length? foco.map(tarjetaFoco).join('<div style="height:10px"></div>') : `<div class="card vacio">No hay nada en el foco. Elige un libro en la Ruta y ponlo en la mesa.</div>`}

  <h2 class="sec">Constancia <span>últimas 18 semanas</span></h2>

function tarjetaFoco(id){
  const {b,l}=IX[id], p=prog(id), si=siguiente(id), u=b.unidades[si];
  const res=respaldosDe(id);

  </article>`;

function tarjetaRato(id){

function mapa(){
  const pd=porDia(), sem=18, ini=lunes(Date.now()-(sem-1)*7*864e5).getTime(), hoy=lunesDia(Date.now());
  let celdas='';
  for(let i=0;i<sem*7;i++){

function etapaActual(l){
  let aqui=-1;
  l.etapas.forEach((e,i)=>{ if(e.libros.some(b=>enMesa(b.id))) { if(aqui<0) aqui=i; } });
  return aqui;
}
function vRuta(){
  const lineasVis=S.ruta.lineas.filter(x=>x.etapas.some(e=>e.libros.some(b=>visible(b.id))));
  if(!lineaSel || !lineasVis.find(l=>l.id===lineaSel)) lineaSel=lineasVis[0]?.id;
  const l=lineasVis.find(x=>x.id===lineaSel);
  if(!l) return `<div class="card vacio" style="margin-top:20px">No hay ruta cargada. Súbela desde Ajustes.</div>`;
  const aqui=etapaActual(l);
  const chips=lineasVis.map(x=>`<button class="${x.id===lineaSel?'on':''}" data-act="linea" data-id="${x.id}"><i style="background:${x.color}"></i>${esc(x.nombre)}</button>`).join('');
  const etapas=l.etapas.map((e,i)=>{
    const todos=e.libros.filter(b=>!b.rol);
    const hecha = todos.length && todos.every(b=>prog(b.id).terminado);
    const cls = hecha?'hecha': i===aqui?'aqui':'';
    const vis=e.libros.filter(b=>visible(b.id)), ocultos=e.libros.length-vis.length;

    <div class="etapas">${etapas}</div>${botonTodo()}`;

    ${b.unidades.length?anillo(b.id,l.color):''}</button>`;

function medidas(b){ const h=hash(b.id), n=b.unidades.length; return {h, alto:150+(h%46), ancho:Math.max(30,Math.min(46,26+(n?Math.sqrt(n)*2:6)+(h>>3)%6))}; }
function baldas(libs,l){
  const max=Math.min(640,window.innerWidth)-32-20; const filas=[[]]; let w=0;
  libs.forEach(b=>{ const a=medidas(b).ancho+3; if(w+a>max && filas.at(-1).length){ filas.push([]); w=0; } filas.at(-1).push(b); w+=a; });
  return filas.map(f=>`<div class="balda">${f.map(b=>lomo(b,l)).join('')}</div>`).join('');
}
function lomo(b,l){
  const {h,alto,ancho}=medidas(b);
  const est=b.estado||'en casa', p=prog(b.id);
  const cls = est==='pedido'?'pedido': est==='por conseguir'?'falta':'';
  const lleno = pct(b.id);
  return `<button class="lomo ${cls} ${p.terminado?'terminado':''}" style="--c:${l.color};height:${alto}px;width:${ancho}px;filter:brightness(${0.86+((h>>5)%22)/100})" data-act="ficha" data-id="${b.id}" aria-label="${esc(b.titulo)}">
    ${lleno&&cls!=='falta'?`<div class="lleno" style="height:${lleno*100}%"></div>`:''}
    <div class="t" style="${b.autor.length>15?'font-size:.62rem':''}">${esc(b.autor)}</div><div class="banda"></div>${enMesa(b.id)?'<div class="pin"></div>':''}</button>`;
}

function proximoSello(){
  const min=S.sesiones.reduce((a,s)=>a+s.min,0), ses=S.sesiones.length;
  const uds=Object.values(S.progreso).reduce((a,p)=>a+(p.hechas?.length||0),0), ideas=S.sesiones.filter(s=>s.lleva).length;
  const c=[
    ['Primera sesión', 1-ses, 'una sesión y es tuyo', 1],
    ['10 horas', 600-min, 'te faltan '+fmtMin(600-min), 600],
    ['50 horas', 3000-min, 'te faltan '+fmtMin(3000-min), 3000],
    ['100 horas', 6000-min, 'te faltan '+fmtMin(6000-min), 6000],
    ['10 sesiones', 10-ses, (10-ses)+(10-ses===1?' sesión':' sesiones'), 10],
    ['50 sesiones', 50-ses, (50-ses)+' sesiones', 50],
    ['Unidad cerrada', 1-uds, 'cierra una unidad', 1],
    ['25 unidades', 25-uds, (25-uds)+(25-uds===1?' unidad':' unidades'), 25],
    ['Cien ideas', 100-ideas, (100-ideas)+' ideas apuntadas', 100],
  ].filter(x=>x[1]>0);
  if(!c.length) return null;
  c.sort((a,b)=>a[1]/a[3]-b[1]/b[3]);
  return {n:c[0][0], falta:c[0][2]};
}
function mejorRacha(){
  const meta=S.ajustes.meta; if(!S.sesiones.length) return 0;
  let t=lunes(Math.min(...S.sesiones.map(s=>s.ini))).getTime(), fin=Date.now(), best=0, cur=0;
  while(t<=fin){ if(minSemana(t)>=meta){cur++;best=Math.max(best,cur);} else if(t+7*864e5<=fin) cur=0; t+=7*864e5; }
  return best;
}

  const a=S.activa, cont=$('#activa');

  const tick=()=>{ const s=Math.floor((Date.now()-a.ini)/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;

  const s={id:Date.now().toString(36), libro:id, unidad, ini:S.activa&&S.activa.libro===id?S.activa.ini:Date.now()-min*60000, min,
    pags:($('#fPag')?.value||'').trim(), lleva:$('#fLleva').value.trim(), ej:parseInt($('#fEj')?.value,10)||0, cerro};
  S.sesiones.push(s);
  const p=prog(id);
  if(cerro && !p.hechas.includes(unidad)) p.hechas.push(unidad);
  p.marca=$('#fMarca').value.trim();
  const padre=IX[id].b.respaldoDe; // la consulta cuenta, pero no mueve el foco
  S.activa=null; guardar(); cerrarHoja(); render();
  const sem=minSemana();
  toast(sem>=S.ajustes.meta&&sem-min<S.ajustes.meta ? `+${fmtMin(min)} · semana cumplida` : `+${fmtMin(min)} anotados. Bien hecho.`);
}

function aMesa(id){

  const focoDe=S.mesa.foco.filter(x=>IX[x]), ratDe=S.mesa.ratos.filter(x=>IX[x]);
  const lineaFoco = focoDe[0]?IX[focoDe[0]]:null;
  let avisos='';
  if(lineaFoco && lineaFoco.l.id===l.id && ei>lineaFoco.ei) avisos+=`<div class="aviso"><b>Esto es de una etapa posterior.</b> Tu foco en ${esc(l.nombre)} está en «${esc(lineaFoco.e.nombre)}» y este libro es de «${esc(IX[id].e.nombre)}».</div>`;
  hoja(`<div class="eyebrow">Poner en la mesa</div><h2>${esc(b.titulo)}</h2><div class="muted">${esc(b.autor)}</div>${avisos}

    </div>
    <div id="sale"></div>
    <div class="acciones"><button class="btn sec" data-act="cerrar">Cancelar</button><button class="btn" data-act="confirmarMesa" data-id="${id}">Poner en la mesa</button></div>`,
  v=>{ const pinta=()=>{ const h=v.querySelector('input[name=hueco]:checked').value; v.querySelector('#sale').innerHTML=bloqueSale(h,id); };

}
function bloqueSale(hueco,id){
  const lista=S.mesa[hueco].filter(x=>IX[x]), lim=hueco==='foco'?S.ajustes.limFoco:S.ajustes.limRatos;
  if(lista.length<lim) return '';
  const opts=lista.map((x,i)=>{ const s=sesDe(x), u=prog(x).hechas.length, ult=s.at(-1);
    return `<label class="opcion"><input type="radio" name="sale" value="${x}" ${i===0?'checked':''}><div><div class="tit">${esc(IX[x].b.autor)} · ${esc(IX[x].b.titulo)}</div><div class="sub">${s.length} ${s.length===1?'sesión':'sesiones'} · ${fmtMin(minDe(x))} · ${u} ${u===1?'unidad':'unidades'}${ult?' · última '+haceDias(ult.ini):''}</div></div></label>`; }).join('');
  return `<div class="aviso" style="margin-top:16px"><b>La mesa está llena.</b> Para que entre uno, sale otro. Mira lo que llevas antes de decidir.</div>
    <div class="opciones">${opts}</div>

}
function confirmarMesa(id){
  const v=$('#velo'); const hueco=v.querySelector('input[name=hueco]:checked').value;
  const lim=hueco==='foco'?S.ajustes.limFoco:S.ajustes.limRatos;
  S.mesa.foco=S.mesa.foco.filter(x=>IX[x]); S.mesa.ratos=S.mesa.ratos.filter(x=>IX[x]);
  if(S.mesa[hueco].length>=lim){
    const sale=v.querySelector('input[name=sale]:checked')?.value;
    if(!sale) return;
    if(hueco==='foco'){
      const m=(v.querySelector('#fMotivo')?.value||'').trim();
      if(m.length<8){ toast('Escribe en una frase por qué cambias de foco'); v.querySelector('#fMotivo')?.focus(); return; }
      S.cambios.push({t:Date.now(), sale, entra:id, motivo:m});
    }
    const ms=v.querySelector('#fMarcaSale').value.trim(); const ps=prog(sale);
    if(ms) ps.marca=ms; ps.aparcado=true;
    S.mesa[hueco]=S.mesa[hueco].filter(x=>x!==sale);
  }
  S.mesa.foco=S.mesa.foco.filter(x=>x!==id); S.mesa.ratos=S.mesa.ratos.filter(x=>x!==id);
  S.mesa[hueco].push(id); prog(id).aparcado=false;
  guardar(); cerrarHoja(); render(); toast('En la mesa: '+IX[id].b.autor);
}
function aparcar(id){
  const p=prog(id);
  hoja(`<div class="eyebrow">Aparcar</div><h2>${esc(IX[id].b.titulo)}</h2>
    <p class="muted" style="font-size:.9rem">Sale de la mesa y vuelve a la estantería. Tu progreso y tus notas se quedan.</p>
    <div class="campo"><label>Dónde lo dejas</label><input id="fMarcaAp" value="${esc(p.marca)}" placeholder="Para retomarlo sin pensar"></div>
    <div class="acciones"><button class="btn sec" data-act="cerrar">Cancelar</button><button class="btn" data-act="confirmarAparcar" data-id="${id}">Aparcar</button></div>`);
}

function editarU(id){
  const b=IX[id].b;
  const txt=b.unidades.map(u=>u.t+(u.p?' | '+u.p:'')).join('\n');
  hoja(`<div class="eyebrow">Índice</div><h2>${esc(b.titulo)}</h2>
    <p class="pista">Una unidad por línea. Si quieres, añade la página tras una barra: <span class="num">2.3 Finite maps | 40</span>. Puedes usar capítulos o secciones, lo que te motive más.</p>
    <div class="campo"><textarea id="fU2" class="mono">${esc(txt)}</textarea></div>
    <p class="pista">Si cambias el orden, las unidades marcadas se recolocan por su título.</p>
    <div class="acciones"><button class="btn sec" data-act="ficha" data-id="${id}">Volver</button><button class="btn" data-act="guardarU" data-id="${id}">Guardar índice</button></div>`);
}
function guardarU(id){
  const b=IX[id].b, p=prog(id);
  const viejos=p.hechas.map(i=>b.unidades[i]?.t).filter(Boolean);
  b.unidades=$('#fU2').value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{ const [t,pg]=x.split('|').map(s=>s.trim()); const n=parseInt(pg,10); return n?{t,p:n}:{t}; });
  p.hechas=b.unidades.map((u,i)=>viejos.includes(u.t)?i:-1).filter(i=>i>=0);
  guardar(); ficha(id); render();
}

/* ---------- ajustes, ruta, copias ---------- */
function ajustes(){
  const a=S.ajustes;
  hoja(`<h2>Ajustes</h2>
    <div class="eyebrow" style="margin-top:6px">Normas de la casa</div>
    <ol class="normas">
      <li>Las matemáticas se hacen en papel; la app solo lleva la cuenta.</li>
      <li>Registrar cuesta menos de un minuto. Lo mínimo: los minutos.</li>
      <li>La constancia se mide por semanas, nunca por días.</li>
      <li>Un mes sin retocar la app${S.ajustes.congelada?` (hasta el ${new Date(S.ajustes.congelada).toLocaleDateString('es-ES')})`:''}. Las mejoras, a una nota.</li>
      <li>Si da culpa en vez de foco, se cambia o se deja.</li>
    </ol>
    <label class="check"><input type="checkbox" id="aPrin" ${S.ajustes.principios!==false?'checked':''}> <span>Mostrar una norma al día en Hoy</span></label>
    <div class="sep"></div>
    <div class="campo"><label>Meta semanal (minutos)</label><input id="aMeta" type="number" inputmode="numeric" value="${a.meta}"></div>
    <div class="dos"><div class="campo"><label>Huecos de foco</label><input id="aLf" type="number" min="1" max="4" value="${a.limFoco}"></div>
    <div class="campo"><label>Huecos de ratos muertos</label><input id="aLr" type="number" min="0" max="6" value="${a.limRatos}"></div></div>
    <div class="acciones"><button class="btn" data-act="guardarAjustes">Guardar</button></div>
    <div class="sep"></div>
    <div class="eyebrow">Ruta</div>
    <p class="pista">Sube una ruta en JSON (archivo o pegada). Se conserva todo tu progreso de los libros que mantengan su identificador.</p>
    <div class="fila" style="margin-top:10px"><button class="btn peq" data-act="rutaRepo">Cargar la ruta publicada</button><label class="btn sec peq">Subir archivo<input type="file" accept=".json,application/json" hidden data-act="subirRuta"></label>
      <button class="btn sec peq" data-act="pegarRuta">Pegar texto</button><button class="btn sec peq" data-act="bajarRuta">Descargar ruta actual</button></div>
    <div class="sep"></div>
    <div class="eyebrow">Copia de seguridad</div>
    <p class="pista">Todo vive en este móvil. Si borras los datos del navegador, se pierde. Descarga una copia de vez en cuando${S.ultimaCopia?` (última: ${new Date(S.ultimaCopia).toLocaleDateString('es-ES')})`:' (aún ninguna)'}.</p>
    <div class="fila" style="margin-top:10px"><button class="btn sec peq" data-act="bajarCopia">Descargar copia</button><label class="btn sec peq">Restaurar copia<input type="file" accept=".json,application/json" hidden data-act="subirCopia"></label></div>
    <div class="sep"></div>
    <div class="fila"><button class="btn peligro peq" data-act="reiniciar">Empezar de cero</button></div>
    <p class="pista" style="margin-top:18px">© Andrés Asensio · La mesa v1.4</p>`);
}
function bajar(nombre, obj){
  const b=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=nombre; document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function normalizarRuta(j){
  if(!j || !Array.isArray(j.lineas)) throw new Error('Falta la lista "lineas"');
  const ids=new Set();
  j.lineas.forEach((l,li)=>{
    l.id=l.id||'linea'+li; l.nombre=l.nombre||'Línea '+(li+1); l.color=l.color||['#2f4f86','#8c3a2b','#3b6a4c','#a3761b','#5e5476'][li%5];
    if(!Array.isArray(l.etapas)) throw new Error(`La línea "${l.nombre}" no tiene "etapas"`);
    l.etapas.forEach((e,ei)=>{ e.nombre=e.nombre||'Etapa '+(ei+1); e.libros=(e.libros||[]).map(b=>{
      if(!b.titulo) throw new Error('Hay un libro sin "titulo"');
      b.id=b.id||b.titulo.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      if(ids.has(b.id)) throw new Error('Identificador repetido: '+b.id); ids.add(b.id);
      b.autor=b.autor||''; b.estado=b.estado||'en casa';
      b.unidades=(b.unidades||[]).map(u=> typeof u==='string' ? (()=>{ const [t,p]=u.split('|').map(s=>s.trim()); const n=parseInt(p,10); return n?{t,p:n}:{t}; })() : u);
      return b; }); });
  });
  return j;
}
function aplicarRuta(texto){
  let j; try{ j=normalizarRuta(JSON.parse(texto)); }catch(e){ toast('Ruta no válida: '+e.message); return; }
  const usarMesa = j.mesa && confirm('La ruta trae su propia mesa (foco y ratos muertos). ¿Usarla? Si cancelas, se queda tu mesa actual.');
  S.ruta={nombre:j.nombre||'Mi ruta', lineas:j.lineas};
  IX=indice();
  if(usarMesa) S.mesa={foco:(j.mesa.foco||[]).filter(x=>IX[x]), ratos:(j.mesa.ratos||[]).filter(x=>IX[x])};
  else S.mesa={foco:S.mesa.foco.filter(x=>IX[x]), ratos:S.mesa.ratos.filter(x=>IX[x])};
  guardar(); cerrarHoja(); render(); toast('Ruta cargada: '+Object.keys(IX).length+' libros');
}

/* ---------- delegación ---------- */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-tab],[data-act]'); if(!t) return;
  if(t.dataset.tab){ vista=t.dataset.tab; cerrarHoja(); render(); window.scrollTo(0,0); return; }
  const a=t.dataset.act, id=t.dataset.id;
  if(['filtro','estado','marca','subirRuta','subirCopia'].includes(a)) return;
  if(t.tagName==='INPUT' && t.type!=='button') return;
  switch(a){
    case 'ajustes': ajustes(); break;
    case 'cerrar': cerrarHoja(); break;
    case 'linea': lineaSel=id; render(); break;
    case 'verTodo': verTodo=!verTodo; render(); window.scrollTo(0,0); break;
    case 'ficha': ficha(id); break;
    case 'empezar': empezar(id); break;
    case 'cronometro': { const u=$('#fU'); S.activa={libro:id, unidad:u?parseInt(u.value,10):-1, ini:Date.now()}; guardar(); cerrarHoja(); render(); toast('Cronómetro en marcha. Puedes cerrar la app: sigue contando.'); break; }
    case 'manual': { const u=$('#fU'); registrar(id, u?parseInt(u.value,10):-1, ''); break; }
    case 'terminar': { const a2=S.activa; registrar(a2.libro, a2.unidad, Math.max(1,Math.round((Date.now()-a2.ini)/60000))); break; }
    case 'descartar': if(confirm('¿Descartar esta sesión sin guardarla?')){ S.activa=null; guardar(); cerrarHoja(); render(); } break;
    case 'guardarSes': guardarSes(id); break;
    case 'toggleU': { const p=prog(id), i=+t.dataset.i; p.hechas=p.hechas.includes(i)?p.hechas.filter(x=>x!==i):[...p.hechas,i]; guardar(); t.classList.toggle('hecha'); render(); break; }
    case 'aMesa': aMesa(id); break;
    case 'confirmarMesa': confirmarMesa(id); break;
    case 'aparcar': aparcar(id); break;
    case 'confirmarAparcar': { const p=prog(id); p.marca=$('#fMarcaAp').value.trim(); p.aparcado=true; S.mesa.foco=S.mesa.foco.filter(x=>x!==id); S.mesa.ratos=S.mesa.ratos.filter(x=>x!==id); guardar(); cerrarHoja(); render(); toast('Aparcado. Te espera en la estantería.'); break; }
    case 'terminarLibro': if(confirm('¿Das este libro por terminado? Sale de la mesa y gana su banda dorada.')){ const p=prog(id); p.terminado=Date.now(); S.mesa.foco=S.mesa.foco.filter(x=>x!==id); S.mesa.ratos=S.mesa.ratos.filter(x=>x!==id); guardar(); cerrarHoja(); render(); toast('Terminado. Enhorabuena.'); } break;
    case 'reabrir': delete prog(id).terminado; guardar(); ficha(id); render(); break;
    case 'editarU': editarU(id); break;
    case 'guardarU': guardarU(id); break;
    case 'borrarSes': if(confirm('¿Borrar esta sesión del cuaderno?')){ S.sesiones=S.sesiones.filter(s=>s.id!==id); guardar(); render(); } break;
    case 'guardarAjustes': { S.ajustes.meta=Math.max(10,parseInt($('#aMeta').value,10)||240); S.ajustes.limFoco=Math.max(1,Math.min(4,parseInt($('#aLf').value,10)||2)); S.ajustes.limRatos=Math.max(0,Math.min(6,parseInt($('#aLr').value,10)||0)); S.ajustes.principios=$('#aPrin').checked; guardar(); cerrarHoja(); render(); toast('Ajustes guardados'); break; }
    case 'pegarRuta': hoja(`<h2>Pegar ruta</h2><p class="pista">Pega aquí el JSON de la ruta.</p><div class="campo"><textarea id="fRuta" class="mono" placeholder='{"nombre":"Mi ruta","lineas":[...]}'></textarea></div><div class="acciones"><button class="btn sec" data-act="ajustes">Volver</button><button class="btn" data-act="aplicarPegada">Cargar</button></div>`); break;
    case 'aplicarPegada': aplicarRuta($('#fRuta').value); break;
    case 'rutaRepo': fetch('ruta.json',{cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; return r.text(); }).then(aplicarRuta).catch(()=>toast('No se ha podido descargar la ruta publicada')); break;
    case 'bajarRuta': bajar('ruta.json', {nombre:S.ruta.nombre, lineas:S.ruta.lineas, mesa:S.mesa}); break;
    case 'bajarCopia': S.ultimaCopia=Date.now(); guardar(); bajar('la-mesa-copia-'+diaClave(Date.now())+'.json', S); toast('Copia descargada'); break;
    case 'reiniciar': if(confirm('Se borrarán todas tus sesiones y tu progreso. ¿Seguro?') && confirm('De verdad: esto no se puede deshacer. ¿Seguimos?')){ S=nuevo(); guardar(); cerrarHoja(); render(); } break;
  }
});
document.addEventListener('change', e=>{
  const t=e.target, a=t.dataset.act, id=t.dataset.id;
  if(a==='filtro'){ filtroCuad=t.value; render(); }
  if(a==='estado'){ IX[id].b.estado=t.value; guardar(); render(); ficha(id); }
  if(a==='marca'){ prog(id).marca=t.value.trim(); guardar(); render(); }
  if(a==='subirRuta' || a==='subirCopia'){
    const f=t.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ if(a==='subirRuta') aplicarRuta(r.result); else {
      try{ const j=JSON.parse(r.result); if(!j.ruta||!j.mesa||!Array.isArray(j.sesiones)) throw 0;
        if(confirm('Se sustituirá todo lo que hay en este móvil por la copia ('+j.sesiones.length+' sesiones). ¿Seguir?')){ S=j; guardar(); cerrarHoja(); render(); toast('Copia restaurada'); } }
      catch(err){ toast('Ese archivo no es una copia de La mesa'); } } };
    r.readAsText(f);
  }
});
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) renderActiva(); });

render();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
